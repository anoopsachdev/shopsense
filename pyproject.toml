[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopsense"
version = "0.1.0"
description = "LLM-assisted product search on Amazon's ESCI shopping-queries dataset."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "fastapi>=0.110",
    "fastembed>=0.5",
    "google-genai>=1.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
